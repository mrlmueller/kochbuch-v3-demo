name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/mrlmueller/kochbuch-v3-backend:latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, kochbuch]

    steps:
      - name: Pull and restart backend
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u mrlmueller --password-stdin
          cd /home/deploy/kochbuch
          docker compose pull backend
          docker compose up -d --no-deps backend
