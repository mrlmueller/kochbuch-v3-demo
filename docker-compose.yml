services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: backend/.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Expose to the host LOOPBACK only so a host-run `go run .` can connect in
    # dev. Binding 127.0.0.1 (not 0.0.0.0) keeps the database off every other
    # interface — in production the backend reaches it over the docker network
    # (DB_HOST=postgres) and nothing external can touch 5432.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/mrlmueller/kochbuch-v3-backend:latest
    restart: unless-stopped
    env_file: backend/.env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
